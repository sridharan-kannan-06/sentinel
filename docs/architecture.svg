<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1080" width="1500" height="1080" font-family="'IBM Plex Sans','Segoe UI',Arial,sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8d8d8d"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#fa4d56"/>
    </marker>
    <style>
      .bg    { fill:#161616; }
      .box   { fill:#262626; stroke:#393939; stroke-width:1.5; }
      .boxhi { fill:#1c2b3a; stroke:#4589ff; stroke-width:2; }
      .boxwarn { fill:#2d1f1f; stroke:#fa4d56; stroke-width:2; }
      .zone  { fill:none; stroke:#6f6f6f; stroke-width:2; stroke-dasharray:8 5; }
      .title { fill:#f4f4f4; font-size:19px; font-weight:600; }
      .h     { fill:#f4f4f4; font-size:16px; font-weight:600; }
      .t     { fill:#c6c6c6; font-size:13.5px; }
      .s     { fill:#8d8d8d; font-size:12px; }
      .mono  { fill:#78a9ff; font-size:12.5px; font-family:'IBM Plex Mono',Consolas,monospace; }
      .zlab  { fill:#8d8d8d; font-size:13px; font-weight:600; letter-spacing:1.2px; }
      .redlab{ fill:#fa4d56; font-size:13px; font-weight:600; }
      .grnlab{ fill:#42be65; font-size:12.5px; font-weight:600; }
      .flow  { stroke:#8d8d8d; stroke-width:1.8; fill:none; marker-end:url(#arrow); }
      .flowr { stroke:#fa4d56; stroke-width:2; fill:none; marker-end:url(#arrowRed); }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1500" height="1080"/>

  <text class="title" x="40" y="46">Sentinel: an autonomous continuity layer for hospital operations</text>
  <text class="s" x="40" y="70">Every service runs on Cloud Run, min-instances 0, in us-central1. Gemini 3.5 Flash answers only on the global endpoint.</text>

  <!-- TRUST BOUNDARY -->
  <rect class="zone" x="40" y="96" width="700" height="272" rx="6"/>
  <text class="zlab" x="58" y="122">HOSPITAL TRUST BOUNDARY</text>
  <text class="s" x="58" y="142">Raw text exists only inside this box. It is never persisted.</text>

  <rect class="box" x="60" y="158" width="180" height="86" rx="4"/>
  <text class="h" x="76" y="182">Inbound</text>
  <text class="t" x="76" y="203">HL7, insurer email</text>
  <text class="t" x="76" y="221">ops console, PDF</text>
  <text class="s" x="76" y="238">names, MRNs, free text</text>

  <rect class="boxhi" x="286" y="158" width="430" height="190" rx="4"/>
  <text class="h" x="304" y="182">sentinel-ingest</text>
  <text class="mono" x="304" y="201">SA sentinel-ingest</text>
  <text class="t" x="304" y="228">1. Idempotency key claimed in a Firestore transaction</text>
  <text class="t" x="304" y="250">2. Model Armor, whole document and again in</text>
  <text class="t" x="318" y="268">overlapping 300-character windows</text>
  <text class="t" x="304" y="290">3. Sensitive Data Protection, deterministic tokens</text>
  <text class="t" x="318" y="308">wrapped by Cloud KMS</text>
  <text class="grnlab" x="304" y="334">Meena Raghavan → PT-8119   Dr. Anil Kumar → DR-0385</text>

  <path class="flow" d="M 240 200 L 282 200"/>

  <!-- PHI stops here -->
  <path class="flowr" d="M 500 348 L 500 396"/>
  <text class="redlab" x="512" y="378">no PHI beyond this line</text>

  <rect class="box" x="360" y="398" width="280" height="46" rx="4"/>
  <text class="h" x="378" y="427">Pub/Sub raw-events</text>

  <path class="flow" d="M 500 444 L 500 486"/>

  <!-- ENGINE -->
  <rect class="boxhi" x="120" y="488" width="760" height="248" rx="4"/>
  <text class="h" x="140" y="514">sentinel-engine</text>
  <text class="mono" x="140" y="533">SA sentinel-engine</text>

  <rect class="box" x="140" y="548" width="222" height="80" rx="4"/>
  <text class="h" x="156" y="572">Interpreter</text>
  <text class="s" x="156" y="591">ADK, gemini-3.5-flash</text>
  <text class="grnlab" x="156" y="612">no tools, proposes only</text>

  <rect class="box" x="378" y="548" width="222" height="80" rx="4"/>
  <text class="h" x="394" y="572">Coordinator</text>
  <text class="s" x="394" y="591">ADK, routes by domain</text>
  <text class="grnlab" x="394" y="612">no tools, cannot act</text>

  <rect class="boxwarn" x="616" y="548" width="246" height="80" rx="4"/>
  <text class="h" x="632" y="572">Policy Engine</text>
  <text class="s" x="632" y="591">deterministic, no model call</text>
  <text class="redlab" x="632" y="612">deny by default, T3 always</text>

  <rect class="box" x="140" y="642" width="342" height="78" rx="4"/>
  <text class="h" x="156" y="666">Obligation Ledger in Firestore</text>
  <text class="t" x="156" y="686">transactional, version guarded, append-only</text>
  <text class="grnlab" x="156" y="706">CLOSED has exactly one predecessor</text>

  <rect class="boxwarn" x="498" y="642" width="364" height="78" rx="4"/>
  <text class="h" x="514" y="666">Evidence Gate</text>
  <text class="t" x="514" y="686">five deterministic checks, no model call</text>
  <text class="redlab" x="514" y="706">0% false closure vs 16% for model judgement</text>

  <!-- TIMERS -->
  <rect class="box" x="920" y="488" width="300" height="112" rx="4"/>
  <text class="h" x="938" y="514">Cloud Tasks</text>
  <text class="t" x="938" y="536">One timer per obligation per checkpoint,</text>
  <text class="t" x="938" y="554">with an explicit scheduleTime.</text>
  <text class="s" x="938" y="578">Cron cannot express "wake about this one".</text>

  <rect class="box" x="920" y="616" width="300" height="120" rx="4"/>
  <text class="h" x="938" y="642">Cloud Scheduler sweep</text>
  <text class="t" x="938" y="664">Every 15 minutes, re-derives every</text>
  <text class="t" x="938" y="682">checkpoint from the obligation itself.</text>
  <text class="grnlab" x="938" y="706">Timers get lost. Obligations do not.</text>
  <text class="s" x="938" y="724">A lost timer costs one sweep interval.</text>

  <path class="flow" d="M 880 545 L 916 545"/>
  <path class="flow" d="M 916 676 L 884 676"/>

  <!-- FLEET -->
  <path class="flow" d="M 489 736 L 489 776"/>
  <text class="s" x="500" y="762">routes, never acts</text>

  <rect class="zone" x="120" y="778" width="760" height="150" rx="6"/>
  <text class="zlab" x="138" y="802">DEPARTMENT FLEET: one image, three identities</text>

  <rect class="box" x="140" y="814" width="232" height="96" rx="4"/>
  <text class="h" x="156" y="838">ClinicalFollowUp</text>
  <text class="mono" x="156" y="857">SA sentinel-clin</text>
  <text class="t" x="156" y="877">notify, request ack</text>
  <text class="redlab" x="156" y="897">no billing, no clinical write</text>

  <rect class="box" x="384" y="814" width="232" height="96" rx="4"/>
  <text class="h" x="400" y="838">RevenueCycle</text>
  <text class="mono" x="400" y="857">SA sentinel-rev</text>
  <text class="t" x="400" y="877">chase docs, submit claim</text>
  <text class="redlab" x="400" y="897">no clinical read or write</text>

  <rect class="box" x="628" y="814" width="234" height="96" rx="4"/>
  <text class="h" x="644" y="838">CarePathway</text>
  <text class="mono" x="644" y="857">SA sentinel-path</text>
  <text class="t" x="644" y="877">blockers, referrals</text>
  <text class="redlab" x="644" y="897">no billing, no clinical write</text>

  <!-- ACTIONS -->
  <path class="flow" d="M 489 928 L 489 966"/>

  <rect class="box" x="120" y="968" width="360" height="82" rx="4"/>
  <text class="h" x="138" y="992">Real action: Gmail API</text>
  <text class="t" x="138" y="1013">T0 and T1 send without asking</text>
  <text class="s" x="138" y="1032">Chat webhooks need Workspace; this account has none</text>

  <rect class="boxwarn" x="500" y="968" width="380" height="82" rx="4"/>
  <text class="h" x="518" y="992">Human approval queue</text>
  <text class="t" x="518" y="1013">T2 parks with the exact outbound payload</text>
  <text class="redlab" x="518" y="1032">a named human, a mandatory reason</text>

  <!-- RIGHT COLUMN -->
  <rect class="box" x="920" y="96" width="540" height="118" rx="4"/>
  <text class="h" x="938" y="122">sentinel-web: the Continuity Board</text>
  <text class="t" x="938" y="144">Ordered by risk of breach, not by deadline.</text>
  <text class="t" x="938" y="164">Root blocker, not the proximate one.</text>
  <text class="t" x="938" y="184">Trust panel carries every config hash in force.</text>
  <text class="s" x="938" y="204">Next.js 16, Carbon g100, SA sentinel-web</text>

  <rect class="boxwarn" x="920" y="230" width="540" height="112" rx="4"/>
  <text class="h" x="938" y="256">sentinel-reid: re-identification</text>
  <text class="redlab" x="938" y="278">the only service closed to the internet</text>
  <text class="t" x="938" y="299">One token at a time. No listing endpoint.</text>
  <text class="t" x="938" y="319">Caller, token and reason logged before it answers.</text>
  <text class="s" x="938" y="336">SA sentinel-reid, only sentinel-web may invoke it</text>

  <rect class="box" x="920" y="358" width="540" height="106" rx="4"/>
  <text class="h" x="938" y="384">Agent Registry</text>
  <text class="t" x="938" y="406">Three A2A agent cards, versioned against the policy.</text>
  <text class="t" x="938" y="426">Skills generated from the allow list, so the catalogue</text>
  <text class="t" x="938" y="446">cannot advertise what policy would refuse.</text>

  <rect class="box" x="920" y="754" width="540" height="174" rx="4"/>
  <text class="h" x="938" y="780">Observability</text>
  <text class="t" x="938" y="802">OpenTelemetry spans across every hop, exported to</text>
  <text class="t" x="938" y="822">Cloud Trace. ADK nests its own beneath them:</text>
  <text class="mono" x="938" y="846">coordinator.route → invoke_agent → call_llm</text>
  <text class="t" x="938" y="870">Structured logs carry obligation_id and trace_id.</text>
  <text class="t" x="938" y="890">Nine log-based metrics on one Monitoring dashboard.</text>
  <text class="s" x="938" y="912">Every number traces back to the line that produced it.</text>

  <rect class="box" x="920" y="944" width="540" height="106" rx="4"/>
  <text class="h" x="938" y="970">The canary</text>
  <text class="t" x="938" y="992">One obligation opened 24 August and left running,</text>
  <text class="t" x="938" y="1012">with real timers on 26, 28 and 30 August.</text>
  <text class="grnlab" x="938" y="1036">No clock is simulated. Nothing is fast-forwarded.</text>

  <path class="flow" d="M 884 660 C 900 660 900 470 916 424"/>
  <path class="flow" d="M 884 620 C 900 600 902 340 916 300"/>
  <path class="flow" d="M 884 590 C 900 500 902 200 916 168"/>
</svg>
